[project]
name = "bookask"
version = "0.1.0"
description = "Agentic RAG over a book: a raw google-genai agent loop compared side by side with a LangChain/LangGraph implementation of the same agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4,<9",
    "google-genai>=2.17,<3",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "chromadb>=1.5,<2",
    "langchain-text-splitters>=1.1,<2",
    "tiktoken>=0.13,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-google-genai>=4.3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
